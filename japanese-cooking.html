<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日本料理日語教材 — 每道菜・每句都有發音</title>
<style>
:root{
  --bg:#faf6ef; --card:#ffffff; --ink:#3a2f2a; --mut:#8a7d72;
  --acc:#c94f3d; --acc-soft:#f6e3df; --line:#e8ddd0;
  --green:#5a7a4f; --green-soft:#e9f0e4;
  --blue:#4a6d8c; --blue-soft:#e4edf4;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);
  font-family:"Hiragino Sans","Noto Sans JP","Microsoft JhengHei","PingFang TC",sans-serif;
  line-height:1.6;padding-bottom:60px}
header{background:var(--acc);color:#fff;padding:26px 18px 22px;text-align:center}
header h1{font-size:22px;letter-spacing:2px}
header p{font-size:13px;opacity:.9;margin-top:6px}
.tools{max-width:860px;margin:14px auto 0;padding:0 16px;display:flex;gap:10px;
  align-items:center;justify-content:flex-end;flex-wrap:wrap}
.tools .hint{font-size:12px;color:var(--mut);margin-right:auto}
.src{font-size:12px;color:var(--blue);background:var(--blue-soft);
  border-radius:20px;padding:5px 12px}
.tgl{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink);
  cursor:pointer;user-select:none;background:var(--card);border:1px solid var(--line);
  border-radius:20px;padding:6px 14px}
.tgl input{accent-color:var(--acc)}
main{max-width:860px;margin:10px auto 0;padding:0 16px}
.dish{background:var(--card);border:1px solid var(--line);border-radius:14px;
  margin-top:18px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.dish-head{display:flex;align-items:center;gap:14px;padding:16px 18px;cursor:pointer}
.dish-no{flex-shrink:0;width:34px;height:34px;border-radius:50%;background:var(--acc-soft);
  color:var(--acc);font-weight:700;display:grid;place-items:center;font-size:15px}
.dish-title{flex:1;min-width:0}
.dish-title ruby{font-size:22px;font-weight:700}
.dish-title rt{font-size:11px;color:var(--acc);font-weight:400}
.dish-sub{font-size:13px;color:var(--mut);margin-top:2px}
.dish-sub b{color:var(--blue);font-weight:600}
.spk{flex-shrink:0;border:1px solid var(--line);background:var(--card);border-radius:50%;
  width:40px;height:40px;font-size:18px;cursor:pointer;display:grid;place-items:center;
  transition:transform .1s,background .15s}
.spk:active{transform:scale(.92)}
.spk.playing{background:var(--acc-soft);border-color:var(--acc)}
.spk.loading{opacity:.45}
.arrow{flex-shrink:0;color:var(--mut);font-size:13px;transition:transform .2s}
.dish.open .arrow{transform:rotate(90deg)}
.dish-body{display:none;border-top:1px dashed var(--line);padding:6px 18px 18px}
.dish.open .dish-body{display:block}
.sec{margin-top:14px}
.sec-tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;
  letter-spacing:1px;border-radius:6px;padding:3px 10px;margin-bottom:8px}
.sec-tag.intro{background:var(--blue-soft);color:var(--blue)}
.sec-tag.ing{background:var(--green-soft);color:var(--green)}
.sec-tag.step{background:var(--acc-soft);color:var(--acc)}
.row{display:flex;align-items:flex-start;gap:10px;padding:9px 10px;border-radius:10px}
.row:hover{background:var(--bg)}
.row+.row{margin-top:2px}
.row .spk{width:32px;height:32px;font-size:14px;margin-top:2px}
.row-main{flex:1;min-width:0}
.row-main ruby{font-size:17px}
.row-main rt{font-size:10px;color:var(--acc)}
.roma{font-size:12.5px;color:var(--blue);font-style:italic;margin-top:1px}
.zh{font-size:12.5px;color:var(--mut);margin-top:1px}
.stepno{flex-shrink:0;width:22px;height:22px;border-radius:50%;background:var(--acc-soft);
  color:var(--acc);font-size:12px;font-weight:700;display:grid;place-items:center;margin-top:5px}
.ing-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:2px 10px}
footer{max-width:860px;margin:34px auto 0;padding:0 16px;font-size:12px;color:var(--mut);
  text-align:center}
.nospeech{display:none;max-width:860px;margin:14px auto 0;padding:10px 16px;
  background:#fdf0d5;border:1px solid #e8d5a0;border-radius:10px;font-size:13px;color:#7a6428}
@media (max-width:520px){
  .dish-title ruby{font-size:19px}
  .ing-grid{grid-template-columns:1fr}
}
</style>
</head>

// ---- 工具函式 ----
const plain = j => j.map(p => Array.isArray(p) ? p[0] : p).join("");
const rubyHTML = j => j.map(p =>
  Array.isArray(p) ? `<ruby>${p[0]}<rt>${p[1]}</rt></ruby>` : p
).join("");

// ---- 語音：瀏覽器內建（Web Speech API，備援）----
const hasSpeech = "speechSynthesis" in window;
let jaVoice = null;
function pickVoice(){
  if(!hasSpeech) return;
  const vs = speechSynthesis.getVoices().filter(v => v.lang && v.lang.replace("_","-").startsWith("ja"));
  jaVoice = vs.find(v => /Enhanced|Premium|增強|拡張|高音質/i.test(v.name))
    || vs.find(v => /Google/i.test(v.name))
    || vs.find(v => /Kyoko|O-?ren|Hattori/i.test(v.name))
    || vs[0] || null;
}
if(hasSpeech){
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}

let currentBtn = null;
let audioEl = null;                    // 雲端語音共用的播放器（重複使用同一顆，手機才不會被擋）
function stopAll(){
  if(hasSpeech) speechSynthesis.cancel();
  if(audioEl){ audioEl.pause(); }
  if(currentBtn){ currentBtn.classList.remove("playing","loading"); currentBtn = null; }
}
function markDone(btn){
  if(currentBtn === btn){ btn.classList.remove("playing","loading"); currentBtn = null; }
}
function speakLocal(text, btn){
  if(!hasSpeech) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "ja-JP";
  if(jaVoice) u.voice = jaVoice;
  u.rate = slowRate() ? 0.6 : 0.9;
  currentBtn = btn;
  btn.classList.add("playing");
  u.onend = u.onerror = () => markDone(btn);
  speechSynthesis.speak(u);
}

// ---- 語音：Google Cloud TTS（雲端 API，主力）----

const ttsCache = new Map();
let apiDead = false;   // API 連續失敗後自動停用，本次瀏覽全部改走瀏覽器語音

// 網路錯/非 2xx/非 JSON 自動重試 1 次（0.8s 退避），跟 video-review 的 fetchJsonRetry 同一套做法
async function fetchTtsRetry(body){
  let lastErr;
  for(let i = 0; i < 2; i++){
    try{
      const r = await fetch("https://texttospeech.googleapis.com/v1/text:synthesize?key=" + TTS_API_KEY,
        { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(body) });
      if(!r.ok) throw new Error("HTTP " + r.status);
      const j = await r.json();
      if(!j.audioContent) throw new Error("empty audioContent");
      return j.audioContent;
    }catch(e){ lastErr = e; if(i < 1) await new Promise(res => setTimeout(res, 800)); }
  }
  throw lastErr;
}

async function fetchTtsUrl(text, rate){
  const key = text + "|" + rate;
  if(ttsCache.has(key)) return ttsCache.get(key);
  const b64 = await fetchTtsRetry({
    input:{ text },
    voice:{ languageCode:"ja-JP", name: TTS_VOICE },
    audioConfig:{ audioEncoding:"MP3", speakingRate: rate }
  });
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for(let k = 0; k < bin.length; k++) arr[k] = bin.charCodeAt(k);
  const url = URL.createObjectURL(new Blob([arr], { type:"audio/mpeg" }));
  ttsCache.set(key, url);
  return url;
}

function speakApi(text, btn){
  const rate = slowRate() ? 0.6 : 0.9;
  currentBtn = btn;
  btn.classList.add("playing","loading");
  fetchTtsUrl(text, rate).then(url => {
    if(currentBtn !== btn) return;   // 等待期間使用者點了別句，這次就不播了
    btn.classList.remove("loading");
    if(!audioEl) audioEl = new Audio();
    audioEl.src = url;
    audioEl.onended = audioEl.onerror = () => markDone(btn);
    audioEl.play().catch(() => {     // 手機首次可能擋非同步播放：這一句先用瀏覽器語音，快取好之後就正常
      markDone(btn);
      speakLocal(text, btn);
    });
  }).catch(() => {                   // API 叫不通（金鑰錯/配額滿/斷線）→ 停用並自動退回瀏覽器語音
    markDone(btn);
    apiDead = true;
    updateSrcBadge();
    speakLocal(text, btn);
  });
}

// ---- 語音：入口 ----
const slowRate = () => document.getElementById("slowChk").checked;
const useApi   = () => TTS_API_KEY && !apiDead;
function speak(text, btn){
  stopAll();
  if(useApi()) speakApi(text, btn);
  else speakLocal(text, btn);
}
function updateSrcBadge(){
  const el = document.getElementById("voiceSrc");
  if(useApi()) el.textContent = "🔈 雲端語音：Google TTS（" + TTS_VOICE + "）";
  else if(hasSpeech) el.textContent = TTS_API_KEY
    ? "🔈 瀏覽器語音（雲端 API 連線失敗，已自動切換）"
    : "🔈 瀏覽器語音（填入 API 金鑰可升級雲端發音）";
  else el.textContent = "🔇 此瀏覽器無法發音";
  document.getElementById("foot").textContent = useApi()
    ? "教材內容：日本家庭料理 8 道｜發音由 Google Cloud Text-to-Speech（ja-JP 神經網路語音）朗讀"
    : "教材內容：日本家庭料理 8 道｜發音由瀏覽器日文語音（ja-JP）朗讀，建議使用 Chrome / Safari / Edge";
}
if(!hasSpeech && !TTS_API_KEY) document.getElementById("noSpeech").style.display = "block";
updateSrcBadge();

// ---- 畫面 ----
function rowHTML(item, stepNo){
  const lead = stepNo ? `<span class="stepno">${stepNo}</span>` : "";
  return `<div class="row">${lead}
    <button class="spk" data-say="${plain(item.j)}" title="朗讀發音">🔊</button>
    <div class="row-main">
      <div>${rubyHTML(item.j)}</div>
      <div class="roma">${item.r}</div>
      <div class="zh">${item.zh}</div>
    </div></div>`;
}

const app = document.getElementById("app");
app.innerHTML = DISHES.map((d, i) => `
<section class="dish" id="dish${i}">
  <div class="dish-head" data-toggle="${i}">
    <span class="dish-no">${i+1}</span>
    <div class="dish-title">
      <div>${rubyHTML(d.name.j)}</div>
      <div class="dish-sub"><b>${d.name.r}</b>｜${d.name.zh}</div>
    </div>
    <button class="spk" data-say="${plain(d.name.j)}" title="朗讀菜名">🔊</button>
    <span class="arrow">▶</span>
  </div>
  <div class="dish-body">
    <div class="sec"><span class="sec-tag intro">📖 簡介・しょうかい</span>${rowHTML(d.intro)}</div>
    <div class="sec"><span class="sec-tag ing">🥬 材料・ざいりょう</span>
      <div class="ing-grid">${d.ings.map(g => rowHTML(g)).join("")}</div></div>
    <div class="sec"><span class="sec-tag step">👨‍🍳 作り方・つくりかた</span>
      ${d.steps.map((s, n) => rowHTML(s, n+1)).join("")}</div>
  </div>
</section>`).join("");

app.addEventListener("click", e => {
  const spk = e.target.closest(".spk");
  if(spk){ speak(spk.dataset.say, spk); e.stopPropagation(); return; }
  const head = e.target.closest(".dish-head");
  if(head) document.getElementById("dish" + head.dataset.toggle).classList.toggle("open");
});
</script>
